name: Android

# Construit l'APK (application et widgets) et lance l'essai sur emulateur : une WebView sans
# interface, lancee par WorkManager, calcule le contenu du widget depuis le build web embarque.
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - 'src/widget/**'
      - 'src/domain/**'
      - 'src/pwa/watchRun.ts'
      - 'widget.html'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/widget/**'
      - 'widget.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Pour publier l'APK en pre-publication (voir l'etape « Publish the APK »).
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web app (embedded in the APK)
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: releve-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # L'application GitHub du telephone n'affiche pas les artefacts des Actions, et un artefact
      # est un zip : l'APK est aussi publie comme piece d'une pre-publication « apk-latest »,
      # remplacee a chaque envoi, que l'application GitHub affiche et telecharge directement.
      - name: Publish the APK as the apk-latest pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk releve-debug.apk
          gh release delete apk-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest releve-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK de test (debug)" \
            --notes "APK de debug de Relevé, non signe pour la publication. Branche : $GITHUB_REF_NAME. Commit : ${GITHUB_SHA::7}. Remplace par chaque nouvel envoi."

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Headless WebView trial on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          # Les rendus des widgets (WidgetScreenshotTest) sont enregistres dans Pictures/releve-widgets
          # de l'emulateur : on les recupere avant son arret, meme si un test echoue.
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest ; status=$? ; mkdir -p widget-screens ; adb pull /sdcard/Pictures/releve-widgets widget-screens || true ; exit $status

      - name: Show the trial timing
        if: always()
        run: grep -rh "RELEVE_SPIKE\|testcase " android/app/build/outputs/androidTest-results 2>/dev/null | head -20 || true

      - name: Upload the widget renderings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-screens
          path: android/widget-screens
          if-no-files-found: warn

      - name: Upload the emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: warn
